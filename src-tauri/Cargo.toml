[package]
name = "tesserica"
version = "0.1.0"
description = "A pixel art editor and image-to-pixel-art converter"
authors = ["Subodh Mishra"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix is required so the lib name does not collide with the bin
# name on Windows. See https://github.com/rust-lang/cargo/issues/8519
name = "tesserica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `gif` pulls in the `gif` crate (MIT/Apache-2.0) and `color_quant` (MIT) for
# animated GIF export (`docs/08-roadmap.md` Phase 4 "Export: ... animated
# GIF") — both already MIT-compatible, so no new top-level dependency is
# needed for it.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
thiserror = "2.0.19"
tauri-plugin-dialog = "2.7.2"
# `.tess` is a ZIP archive (docs/10-decisions.md D3). Deflate only — the
# default feature set pulls in bzip2, lzma, zstd and AES, none of which the
# format uses, and the installer budget is 20 MB (docs/07 §6).
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

# Image pipeline dependencies are added in Phase 2 (see docs/08-roadmap.md).
# Note: the `palette` crate is deliberately NOT used — Oklab is hand-rolled in
# both languages from identical constants so golden-test parity is structural
# (docs/10-decisions.md D10).

# ONNX Runtime bindings for background-removal segmentation (`docs/04` §8,
# `docs/07` §3.1). No stable release exists (re-verified 2026-07-30: latest is
# `2.0.0-rc.13`, still an rc) — pinned to the *exact* version, no caret range,
# and isolated entirely behind `src-tauri/src/segment/` per that section so
# the rest of the app never touches `ort` directly. `rembg-rs` was evaluated
# and rejected (see `docs/10-decisions.md` D15): it just wraps `ort` itself
# (pinned to an older `^2.0.0-rc.10`) and drags in `imagequant`/`oxipng`, an
# indexed-color quantization + PNG-recompression pipeline this project does
# not want (D9 is RGBA-only; quantization already happens in `pipeline::
# quantize`), for no isolation benefit over depending on `ort` directly.
# `default-features = false` + `load-dynamic` (instead of `ort`'s default
# `download-binaries`) means this crate never fetches a prebuilt ONNX Runtime
# binary at build time; the real `libonnxruntime.so` is `dlopen`ed only at
# runtime, when a caller actually points `segment::Segmenter::load` at one —
# which has not happened yet (no runtime or model is bundled or downloaded in
# this dispatch).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic"] }

# Checksum verification for the on-demand larger-model download
# (`commands::segment`, `docs/08-roadmap.md` Phase 5 "on-demand download for
# larger models with explicit consent"). Small, `std`-only, no transitive
# dependencies of its own. The actual HTTP fetch happens in the frontend
# (plain `fetch()`, since the model bytes still have to come from somewhere a
# user explicitly triggered) — Rust's only job is to verify the bytes it is
# handed over the raw invoke body and write them to disk, so this crate is
# the one new dependency that download needs, not an HTTP client.
md5 = "0.8.1"

# Checksum verification for the on-demand ONNX Runtime *native library*
# download (`commands::onnx_runtime`, `docs/10-decisions.md` D16). The archive
# published for `libonnxruntime.so` is signed with a per-release sha256, not
# md5, so this is a second small hashing crate rather than reusing `md5`
# above — `sha2` was already resolved transitively (via `zip`'s own
# dependency tree) before this addition, so this adds no new entry to
# `Cargo.lock`, only a direct `[dependencies]` line so this crate's own code
# may call it.
sha2 = "0.10.9"

# Extracting the single `libonnxruntime.so` file this project actually needs
# out of the `.tar.gz` release asset upstream publishes (`docs/10-decisions.md`
# D16) — `flate2` (gzip) was already resolved transitively via `zip`'s
# `deflate-flate2` feature; `tar` is genuinely new but small, well-established
# (`alexcrichton/tar-rs`), MIT/Apache-2.0, and does not itself perform
# decompression, matching the "small, isolated, no surprise transitive tree"
# bar the rest of this section holds new dependencies to.
flate2 = "1"
tar = "0.4.46"

# `.ase`/`.aseprite` import (`docs/08-roadmap.md` Phase 6 "`.ase` import";
# evaluated against a hand-rolled parser per `docs/01-reference-analysis.md`
# §9, decision recorded as `docs/10-decisions.md` D17). `aseprite-io` parses
# the full binary chunk set this project's own `Sprite` model can express —
# palette, every layer kind, every cel kind (raw/zlib-compressed/linked/
# tilemap), tags, slices, tilesets, user data — with byte-perfect round-trip
# claimed by its own docs; this project only ever reads with it (export stays
# out of scope per `01` §9). Re-verified directly against crates.io rather
# than trusted from an earlier note: v0.2.0, released 2026-06-30, MIT OR
# Apache-2.0, its only dependency is `flate2` (already resolved transitively
# via `zip`'s own `deflate-flate2` feature, so this adds no new entry to the
# dependency tree). `default-features = false` — the optional `image`/
# `tiny-skia` conversion helpers are left off; converting grayscale/indexed
# source pixels to straight-alpha RGBA (D9 — v1 is RGBA only) against the
# file's own palette is small enough to do by hand in `commands::ase_import`.
aseprite-io = { version = "0.2.0", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# The pixel pipeline is unusably slow in an unoptimized debug build. Optimize
# dependencies even in dev so `tauri dev` stays responsive once Phase 2 lands.
[profile.dev.package."*"]
opt-level = 2
