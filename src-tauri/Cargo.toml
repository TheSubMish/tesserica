[package]
name = "tesserica"
version = "0.1.0"
description = "A pixel art editor and image-to-pixel-art converter"
authors = ["Subodh Mishra"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix is required so the lib name does not collide with the bin
# name on Windows. See https://github.com/rust-lang/cargo/issues/8519
name = "tesserica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
thiserror = "2.0.19"
tauri-plugin-dialog = "2.7.2"
# `.tess` is a ZIP archive (docs/10-decisions.md D3). Deflate only — the
# default feature set pulls in bzip2, lzma, zstd and AES, none of which the
# format uses, and the installer budget is 20 MB (docs/07 §6).
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

# Image pipeline dependencies are added in Phase 2 (see docs/08-roadmap.md).
# Note: the `palette` crate is deliberately NOT used — Oklab is hand-rolled in
# both languages from identical constants so golden-test parity is structural
# (docs/10-decisions.md D10).

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# The pixel pipeline is unusably slow in an unoptimized debug build. Optimize
# dependencies even in dev so `tauri dev` stays responsive once Phase 2 lands.
[profile.dev.package."*"]
opt-level = 2
